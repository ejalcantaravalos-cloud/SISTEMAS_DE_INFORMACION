services:
  mysql:
    image: mysql:latest
    container_name: mysql_node
    environment:
      MYSQL_ROOT_PASSWORD: contrasena
      MYSQL_DATABASE: UG
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
  app:
    build: .
    container_name: app_node_container
    command: npm run dev
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mysql
    links:
      - mysql

volumes:
  db_data: